# planeodev fork only (not for upstream): builds ghcr.io/planeodev/paperclip-operator:<branch>-<sha7>
# with the shared Vionix pipeline, the way every planeodev image is built (planeo-infra CLAUDE.md §9).
name: 🐳 planeo docker-multiarch-cicd
run-name: 🐳 paperclip-operator image — ${{ github.event_name }} ${{ github.ref_name }} ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    branches: [planeo/main]
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [planeo/main]

jobs:
  setup:
    name: 🔧 setup
    runs-on: ubuntu-latest
    outputs:
      dockerhub-token: ${{ steps.secrets.outputs.token }}
      dockerhub-username: ${{ steps.secrets.outputs.username }}
    steps:
      - name: Load secrets
        id: secrets
        run: |
          echo "username=${{ secrets.DOCKER_REGISTRY_USERNAME }}" >> "$GITHUB_OUTPUT"
          echo "token=${{ secrets.DOCKER_REGISTRY_TOKEN }}" >> "$GITHUB_OUTPUT"

  docker-multiarch:
    name: 🐳 docker
    needs: [setup]
    uses: vionix-proj/github-platform/.github/workflows/docker-multiarch-cicd.yaml@main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    with:
      registry: ghcr.io
      platforms: linux/amd64,linux/arm64
      docker-compose-file-name: docker-compose.yaml
      docker-compose-target-service: paperclip-operator
      dockerhub-registry: docker.io
      dockerhub-namespace: ${{ github.repository_owner }}
      dockerhub-registry-username: ${{ needs.setup.outputs.dockerhub-username }}
      dockerhub-registry-token: ${{ needs.setup.outputs.dockerhub-token }}
      push-attestations: "false"
